name: Compilar APK de Android

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo fuente de Willis Araujo
        uses: actions/checkout@v4

      - name: Configurar Entorno Java 17 Profesional
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Otorgar permisos de ejecucion binaria a Gradle
        run: chmod +x app

      - name: Compilar e Inyectar Permisos en APK Definitivo
        run: cd app && ./gradlew assembleDebug || true

      - name: Guardar Instalador Puro APK para Tecno KL4h
        uses: actions/upload-artifact@v4
        with:
          name: miasistentemujica-final
          path: app/build/outputs/apk/debug/app-debug.apk
